name: Publish managed host update
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # Each channel's tag moves only after CI succeeds on a push to that branch.
    # `anton-ahpd` stays the main promotion. `anton-ahpd-develop` is the develop
    # channel, and a main install never fetches it.
    branches: [main, develop]
permissions:
  contents: write
concurrency:
  group: managed-host-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  publish-main:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Promote the tested main commit
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || exit 0
          git tag -f anton-ahpd "$TESTED_SHA"
          git push origin refs/tags/anton-ahpd --force
          if gh release view anton-ahpd >/dev/null 2>&1; then
            gh release edit anton-ahpd --title 'Anton managed AHP host' --notes "Validated host update from $TESTED_SHA. Managed installations update when idle."
          else
            gh release create anton-ahpd --title 'Anton managed AHP host' --notes "Validated host update from $TESTED_SHA. Managed installations update when idle."
          fi
  publish-develop:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 1
      - name: Promote the tested develop commit
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || exit 0
          git tag -f anton-ahpd-develop "$TESTED_SHA"
          git push origin refs/tags/anton-ahpd-develop --force
          if gh release view anton-ahpd-develop >/dev/null 2>&1; then
            gh release edit anton-ahpd-develop --title 'Anton managed AHP host (develop)' --notes "Validated host update from $TESTED_SHA. Develop installations update when idle."
          else
            gh release create anton-ahpd-develop --title 'Anton managed AHP host (develop)' --notes "Validated host update from $TESTED_SHA. Develop installations update when idle."
          fi
